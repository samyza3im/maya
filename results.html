<!DOCTYPEhtml>
<htmllang="fr">
<head>
<metacharset="UTF-8">
<metaname="viewport"content="width=device-width,initial-scale=1.0">
<title>Résultats—Maya&Samy</title>
<scriptsrc="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
box-sizing:border-box;
}
html,
body{
margin:0;
min-height:100%;
font-family:Arial,sans-serif;
background:#08090d;
color:white;
}
body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}
.card{
width:min(560px,100%);
padding:35px;
border-radius:28px;
background:rgba(18,19,27,0.88);
border:1pxsolidrgba(255,255,255,.12);
box-shadow:030px100pxrgba(0,0,0,.55);
backdrop-filter:blur(20px);
}
h1{
margin:0010px;
text-align:center;
font-family:Georgia,serif;
font-size:38px;
font-weight:500;
}
.subtitle{
text-align:center;
color:#999;
margin-bottom:30px;
}
label{
display:block;
margin:15px08px;
color:#ccc;
font-size:14px;
}
input{
width:100%;
padding:15px;
border-radius:14px;
border:1pxsolidrgba(255,255,255,.12);
background:#0d0e13;
color:white;
font-size:16px;
outline:none;
}
input:focus{
border-color:rgba(255,255,255,.4);
}
.buttons{
display:grid;
grid-template-columns:1fr1fr;
gap:12px;
margin-top:22px;
}
button{
padding:15px;
border-radius:14px;
border:none;
cursor:pointer;
font-weight:bold;
font-size:15px;
transition:.2s;
}
button:hover{
transform:translateY(-2px);
}
.login{
background:white;
color:#08090d;
}
.signup{
background:#171820;
color:white;
border:1pxsolidrgba(255,255,255,.12);
}
.status{
min-height:22px;
text-align:center;
margin-top:18px;
color:#aaa;
font-size:14px;
}
.error{
color:#e4a1b3;
}
.success{
color:#b5d8c0;
}
#privateArea{
display:none;
}
.result{
margin-top:25px;
padding:28px;
border-radius:22px;
text-align:center;
background:rgba(255,255,255,.05);
border:1pxsolidrgba(255,255,255,.1);
}
.result-label{
color:#888;
font-size:13px;
text-transform:uppercase;
letter-spacing:2px;
margin-bottom:15px;
}
.choice{
font-family:Georgia,serif;
font-size:30px;
line-height:1.4;
}
.date{
color:#777;
font-size:13px;
margin-top:15px;
}
.logout{
width:100%;
margin-top:16px;
background:transparent;
color:#aaa;
border:1pxsolidrgba(255,255,255,.12);
}
@media(max-width:520px){
.card{
padding:25px;
}
.buttons{
grid-template-columns:1fr;
}
h1{
font-size:31px;
}
}
</style>
</head>
<body>
<mainclass="card">
<!--CONNEXION-->
<sectionid="loginArea">
<h1>Espaceprivé</h1>
<pclass="subtitle">
Connecte-toiavectonadressee-mailettonmotdepasse.
</p>
<labelfor="email">Adressee-mail</label>
<input
id="email"
type="email"
autocomplete="email"
placeholder="ton@email.com"
>
<labelfor="password">Motdepasse</label>
<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Tonmotdepasse"
>
<divclass="buttons">
<buttonclass="login"id="loginBtn">
Seconnecter
</button>
<buttonclass="signup"id="signupBtn">
Créeruncompte
</button>
</div>
<pid="status"class="status"></p>
</section>
<!--ESPACEPRIVÉ-->
<sectionid="privateArea">
<h1>Résultat</h1>
<pclass="subtitle">
RéponsedeMaya
</p>
<divclass="result"id="result">
<divclass="result-label">
Laréponseest
</div>
<divclass="choice"id="choice">
Chargement...
</div>
<divclass="date"id="date"></div>
</div>
<buttonclass="logout"id="logoutBtn">
Sedéconnecter
</button>
</section>
</main>
<script>
constSUPABASE_URL=
"https://qximvwamunvvjredtets.supabase.co";
constSUPABASE_KEY=
"sb_publishable_qUPsfiHpq5-V0j-5QJY_sg_7VBe5T48";
constsupabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
constloginArea=
document.getElementById("loginArea");
constprivateArea=
document.getElementById("privateArea");
conststatus=
document.getElementById("status");
constemailInput=
document.getElementById("email");
constpasswordInput=
document.getElementById("password");
constchoiceElement=
document.getElementById("choice");
constdateElement=
document.getElementById("date");
functionshowStatus(message,type=""){
status.textContent=message;
status.className=
"status"+type;
}
asyncfunctionloadChoice(){
choiceElement.textContent=
"Chargement...";
dateElement.textContent="";
const{data,error}=
awaitsupabaseClient
.from("relationship_choices")
.select("choice,created_at")
.eq(
"survey_id",
"maya-samy-choice"
)
.maybeSingle();
if(error){
console.error(error);
choiceElement.textContent=
"Impossibledechargerlerésultat.";
return;
}
if(!data){
choiceElement.textContent=
"Aucuneréponsepourlemoment.";
return;
}
if(data.choice==="love"){
choiceElement.textContent=
"نكملكحبيبين";
}elseif(data.choice==="friends"){
choiceElement.textContent=
"نكملكأصدقاء";
}else{
choiceElement.textContent=
data.choice;
}
constdate=
newDate(data.created_at);
dateElement.textContent=
date.toLocaleString(
"fr-FR",
{
dateStyle:"long",
timeStyle:"short"
}
);
}
asyncfunctionshowPrivateArea(){
loginArea.style.display=
"none";
privateArea.style.display=
"block";
awaitloadChoice();
}
functionshowLoginArea(){
loginArea.style.display=
"block";
privateArea.style.display=
"none";
}
/*=========================
CONNEXION
=========================*/
document
.getElementById("loginBtn")
.addEventListener(
"click",
asyncfunction(){
constemail=
emailInput.value.trim();
constpassword=
passwordInput.value;
if(!email||!password){
showStatus(
"Entretone-mailettonmotdepasse.",
"error"
);
return;
}
showStatus(
"Connexion..."
);
const{data,error}=
awaitsupabaseClient.auth
.signInWithPassword({
email:email,
password:password
});
if(error){
console.error(error);
showStatus(
error.message,
"error"
);
return;
}
showStatus("");
awaitshowPrivateArea();
}
);
/*=========================
CREATIONCOMPTE
=========================*/
document
.getElementById("signupBtn")
.addEventListener(
"click",
asyncfunction(){
constemail=
emailInput.value.trim();
constpassword=
passwordInput.value;
if(!email||!password){
showStatus(
"Entreune-mailetunmotdepasse.",
"error"
);
return;
}
if(password.length<6){
showStatus(
"Lemotdepassedoitconteniraumoins6caractères.",
"error"
);
return;
}
showStatus(
"Créationducompte..."
);
const{data,error}=
awaitsupabaseClient.auth
.signUp({
email:email,
password:password,
options:{
emailRedirectTo:
window.location.href
}
});
if(error){
console.error(error);
showStatus(
error.message,
"error"
);
return;
}
/*
Silaconfirmatione-mail
estactivéedansSupabase,
sessionseranull.
*/
if(!data.session){
showStatus(
"Comptecréé.Vérifietone-mailpuisconnecte-toi.",
"success"
);
return;
}
showStatus("");
awaitshowPrivateArea();
}
);
/*=========================
DECONNEXION
=========================*/
document
.getElementById("logoutBtn")
.addEventListener(
"click",
asyncfunction(){
awaitsupabaseClient.auth.signOut();
showLoginArea();
emailInput.value="";
passwordInput.value="";
showStatus("");
}
);
/*=========================
VERIFIERSESSION
=========================*/
(asyncfunction(){
const{
data:{session}
}=
awaitsupabaseClient.auth
.getSession();
if(session){
awaitshowPrivateArea();
}else{
showLoginArea();
}
})();
</script>
</body>
</html>
